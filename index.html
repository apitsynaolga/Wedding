<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Свадебный квест</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Press Start 2P', monospace;
            background: #1a0f1f;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            image-rendering: pixelated;
            overflow: hidden;
        }

        #app {
            width: 100%;
            max-width: 960px;
            aspect-ratio: 16 / 10;
            position: relative;
            border: 6px solid #cd7542;
            border-radius: 0px;
            box-shadow: 0 0 0 4px #543235, 0 20px 60px rgba(0,0,0,0.8);
            background: #ecd1a4;
            overflow: hidden;
        }

        /* ===== ЭКРАН МЕНЮ ===== */
        #menuScreen {
            position: absolute;
            inset: 0;
            background: #d9b382;
            background-image: url('data:image/svg+xml;utf8,<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><rect width="200" height="200" fill="%23d9b382"/><path d="M0 20 Q50 15 100 22 T200 18" stroke="%23c4a074" stroke-width="2" fill="none" opacity="0.5"/><path d="M0 45 Q60 50 120 43 T200 47" stroke="%23c4a074" stroke-width="2" fill="none" opacity="0.4"/><path d="M0 70 Q40 65 90 72 T200 68" stroke="%23c4a074" stroke-width="2" fill="none" opacity="0.5"/><path d="M0 95 Q70 100 130 93 T200 97" stroke="%23c4a074" stroke-width="2" fill="none" opacity="0.4"/><path d="M0 120 Q50 115 100 122 T200 118" stroke="%23c4a074" stroke-width="2" fill="none" opacity="0.5"/><path d="M0 145 Q60 150 120 143 T200 147" stroke="%23c4a074" stroke-width="2" fill="none" opacity="0.4"/><path d="M0 170 Q40 165 90 172 T200 168" stroke="%23c4a074" stroke-width="2" fill="none" opacity="0.5"/></svg>');
            background-size: 200px 200px;
            display: grid;
            grid-template-rows: 1fr 2fr 1fr;
            align-items: center;
            justify-items: center;
            padding: 20px 40px;
            transition: opacity 0.6s ease;
            z-index: 10;
        }

        #menuScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* ===== ВЕРХНЯЯ ЧАСТЬ (Фокс) ===== */
        .menu-top {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        /* ===== СРЕДНЯЯ ЧАСТЬ (Текст + кнопки) ===== */
        .menu-center {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        /* ===== НИЖНЯЯ ЧАСТЬ (Тишка) ===== */
        .menu-bottom {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        /* ===== КОТЫ ===== */
        .cat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
        }

        .cat-item:hover {
            transform: scale(1.05);
        }
        .cat-item:active {
            transform: scale(0.9);
        }

        .cat-sprite {
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            border-radius: 0px;
            border: 3px solid transparent;
            padding: 5px;
        }

        #gingerCat .cat-sprite {
            width: 200px;
            height: 120px;
        }

        #grayCat .cat-sprite {
            width: 130px;
            height: 190px;
        }

        .cat-item:hover .cat-sprite {
            border-color: #cd593c;
            background: rgba(205, 89, 60, 0.05);
            box-shadow: 0 0 20px rgba(205, 89, 60, 0.1);
        }

        .cat-sprite img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
        }

        /* ===== ОБЛАЧКО ===== */
        .cat-speech {
            position: absolute;
            background: #ecd1a4;
            border: 3px solid #cd7542;
            padding: 8px 14px;
            border-radius: 0px;
            color: #1a0f1f;
            font-size: 0.55rem;
            line-height: 1.8;
            max-width: 220px;
            min-width: 80px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s;
            box-shadow: inset -2px -2px 0 #79606f, inset 2px 2px 0 #ecd1a4;
            pointer-events: none;
            white-space: normal;
            word-wrap: break-word;
            z-index: 20;
        }

        #gingerCat .cat-speech {
            top: 110%;
            bottom: auto;
            left: 50%;
            transform: translateX(-50%);
        }

        #gingerCat .cat-speech::after {
            content: '';
            position: absolute;
            top: -14px;
            bottom: auto;
            left: 50%;
            transform: translateX(-50%);
            border: 7px solid transparent;
            border-bottom-color: #cd7542;
            border-top-color: transparent;
        }

        #grayCat .cat-speech {
            bottom: 110%;
            top: auto;
            left: 50%;
            transform: translateX(-50%);
        }

        #grayCat .cat-speech::after {
            content: '';
            position: absolute;
            bottom: -14px;
            top: auto;
            left: 50%;
            transform: translateX(-50%);
            border: 7px solid transparent;
            border-top-color: #cd7542;
            border-bottom-color: transparent;
        }

        .cat-speech.show {
            opacity: 1;
        }

        /* ===== ЛОГОТИП ===== */
        .pixel-logo {
            font-family: 'Press Start 2P', monospace;
            font-size: 3.2rem;
            color: #543235;
            text-shadow: 3px 3px 0 #ecd1a4, 5px 5px 0 #cd7542;
            letter-spacing: 2px;
            text-align: center;
            line-height: 1.3;
        }

        .pixel-logo small {
            font-size: 0.9rem;
            display: block;
            color: #9b6250;
            text-shadow: 2px 2px 0 #ecd1a4;
            margin-top: 8px;
        }

        .pixel-sub {
            color: #79606f;
            font-size: 0.6rem;
            margin-bottom: 15px;
        }

        /* ===== КНОПКИ В МЕНЮ ===== */
        .menu-center .btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
        }

        .menu-center .pixel-btn {
            flex: 1 1 auto;
            min-width: 140px;
            text-align: center;
            white-space: nowrap;
        }

        .menu-center .sound-btn {
            background: #9b6250;
            border: none;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            font-size: 1.5rem;
            color: #ecd1a4;
            cursor: pointer;
            box-shadow: inset -4px -4px 0 #543235, inset 4px 4px 0 #ecd1a4;
            transition: 0.05s linear;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .menu-center .sound-btn:hover {
            background: #cd593c;
        }

        .menu-center .sound-btn:active {
            transform: scale(0.9);
        }

        /* ===== КНОПКИ ОБЩИЕ ===== */
        .pixel-btn {
            font-family: 'Press Start 2P', monospace;
            background: #cd7542;
            border: none;
            padding: 14px 36px;
            font-size: 0.9rem;
            color: #ecd1a4;
            text-shadow: 2px 2px 0 #543235;
            box-shadow: inset -4px -4px 0 #9b6250, inset 4px 4px 0 #ecd1a4;
            cursor: pointer;
            transition: 0.05s linear;
            margin: 5px;
            min-width: 140px;
        }

        .pixel-btn:hover {
            background: #cd593c;
            box-shadow: inset -4px -4px 0 #543235, inset 4px 4px 0 #ecd1a4;
            transform: scale(1.02);
        }
        .pixel-btn:active {
            transform: scale(0.95);
            box-shadow: inset 4px 4px 0 #9b6250, inset -4px -4px 0 #ecd1a4;
        }

        /* ===== КНОПКИ НА ИГРОВОМ ЭКРАНЕ ===== */
        .btn-exit-game {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 50;
            background: #543235;
            border: none;
            color: #ecd1a4;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.75rem;
            padding: 15px 24px;
            box-shadow: inset -3px -3px 0 #1a0f1f, inset 3px 3px 0 #79606f;
            cursor: pointer;
            transition: 0.05s;
        }
        .btn-exit-game:hover {
            background: #cd593c;
        }
        .btn-exit-game:active {
            transform: scale(0.9);
        }

        .btn-time-toggle {
            position: absolute;
            bottom: 16px;
            right: 16px;
            z-index: 50;
            background: #543235;
            border: none;
            color: #ecd1a4;
            font-family: 'Press Start 2P', monospace;
            font-size: 1.05rem;
            padding: 12px 21px;
            box-shadow: inset -3px -3px 0 #1a0f1f, inset 3px 3px 0 #79606f;
            cursor: pointer;
            transition: 0.05s;
        }
        .btn-time-toggle:hover {
            background: #cd593c;
        }
        .btn-time-toggle:active {
            transform: scale(0.9);
        }

        .progress-counter {
            position: absolute;
            bottom: 16px;
            left: 16px;
            z-index: 50;
            background: #543235;
            padding: 12px 24px;
            border: 4px solid #cd7542;
            color: #ecd1a4;
            font-size: 0.8rem;
            box-shadow: inset -3px -3px 0 #1a0f1f, inset 3px 3px 0 #79606f;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .progress-counter.complete {
            color: #ffd700;
            border-color: #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        /* ===== ИГРОВОЙ ЭКРАН ===== */
        #gameScreen {
            position: absolute;
            inset: 0;
            background: #90969f;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }
        #gameScreen.active {
            opacity: 1;
            pointer-events: auto;
        }

        .game-scene {
            width: 100%;
            height: 100%;
            position: relative;
            background: #728065;
            overflow: hidden;
        }

        .game-scene img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            image-rendering: pixelated;
            pointer-events: none;
        }

        /* ===== НЕВИДИМЫЕ ЗОНЫ ===== */
        .pixel-zone {
            position: absolute;
            cursor: zoom-in;
            border: 2px solid rgba(205, 89, 60, 0);
            transition: all 0.15s;
            border-radius: 0px;
        }

        .pixel-zone:hover {
            background: rgba(166, 218, 208, 0.15);
            border-color: rgba(205, 89, 60, 0.5);
            box-shadow: inset 0 0 20px rgba(205, 89, 60, 0.05);
        }

        /* ===== МОДАЛЬНОЕ ОКНО ===== */
        .pixel-modal {
            position: fixed;
            inset: 0;
            background: rgba(26, 15, 31, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
            backdrop-filter: blur(2px);
        }
        .pixel-modal.show {
            display: flex;
        }

        .pixel-modal-box {
            background: #ecd1a4;
            border: 6px solid #cd7542;
            box-shadow: 
                inset -4px -4px 0 #9b6250,
                inset 4px 4px 0 #f5e6d3,
                0 0 40px rgba(205, 89, 60, 0.15);
            border-radius: 0px;
            padding: 30px 35px;
            max-width: 460px;
            width: 90%;
            animation: pixelPop 0.2s steps(2);
            max-height: 80vh;
            overflow-y: auto;
        }

        @keyframes pixelPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .pixel-modal-box h2 {
            font-family: 'Press Start 2P', monospace;
            font-size: 1.2rem;
            color: #543235;
            text-shadow: 2px 2px 0 #ecd1a4;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .pixel-modal-box p {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.7rem;
            line-height: 1.8;
            color: #1a0f1f;
            margin-bottom: 20px;
            transform: scaleY(1.15);
            display: inline-block;
        }

        .pixel-modal-box .pixel-btn {
            font-size: 0.7rem;
            padding: 10px 28px;
            min-width: auto;
        }

        .pixel-modal-box img {
            max-width: 100%;
            border-radius: 0px;
            margin-bottom: 15px;
            border: 2px solid #cd7542;
        }

        /* ===== КНОПКИ-ЗНАЧКИ В МЕНЮ ===== */
        .btn-later {
            background: #543235;
            border: 3px solid #cd7542;
            color: #ecd1a4;
            font-family: 'Press Start 2P', monospace;
            font-size: 1.4rem;
            padding: 8px 12px;
            box-shadow: inset -3px -3px 0 #1a0f1f, inset 3px 3px 0 #79606f;
            cursor: pointer;
            transition: 0.05s;
        }

        .btn-later:hover {
            background: #cd593c;
        }
        .btn-later:active {
            transform: scale(0.9);
        }

        /* ===== ФИНАЛЬНАЯ КНОПКА ===== */
        .btn-final {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            background: #cd593c;
            font-size: 0.8rem;
            padding: 16px 40px;
            box-shadow: 0 0 40px rgba(205, 89, 60, 0.5);
            animation: pulse 1.5s infinite;
            display: none;
            border: 3px solid #ffd700;
        }

        .btn-final:hover {
            animation: none;
            transform: translateX(-50%) scale(1.05);
            background: #b84a30;
        }

        @keyframes pulse {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.05); }
            100% { transform: translateX(-50%) scale(1); }
        }

        /* ===== СТИЛИ ДЛЯ ТИТРОВ ===== */
        .credits-text {
            font-size: 0.8rem;
            line-height: 2;
            text-align: center;
            color: #1a0f1f;
            white-space: pre-line;
        }

        .credits-text .highlight {
            color: #cd593c;
        }

        /* ===== ВСПЛЫВАШКА АЧИВОК (как в Steam) ===== */
        .achievement-popup {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2d241a;
            border: 4px solid #cd7542;
            padding: 15px 20px;
            z-index: 1000;
            box-shadow: 0 0 30px rgba(0,0,0,0.7);
            animation: slideIn 0.5s ease;
            max-width: 300px;
        }

        .achievement-popup.hide {
            animation: slideOut 0.5s ease forwards;
        }

        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(400px); opacity: 0; }
        }

        .achievement-popup h3 {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.7rem;
            color: #ffd700;
            margin-bottom: 8px;
        }

        .achievement-popup p {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.6rem;
            color: #ecd1a4;
            line-height: 1.6;
            margin-bottom: 5px;
        }

        .achievement-popup .ach-name {
            color: #cd593c;
            font-size: 0.65rem;
        }

        /* ===== СПИСОК АЧИВОК ===== */
        .achievements-list {
            text-align: left;
            font-size: 0.65rem;
            line-height: 2;
        }

        .achievements-list .got {
            color: #cd593c;
        }

        .achievements-list .not-got {
            color: #9b6250;
        }

        /* ===== АДАПТАЦИЯ ===== */
        @media (max-width: 700px) {
            .pixel-logo { font-size: 2rem; }
            .pixel-logo small { font-size: 0.6rem; }
            .pixel-btn { font-size: 0.6rem; padding: 10px 20px; min-width: 100px; }
            .pixel-modal-box { padding: 20px; }
            .pixel-modal-box h2 { font-size: 0.9rem; }
            .pixel-modal-box p { font-size: 0.6rem; }
            .credits-text { font-size: 0.7rem; }
            .btn-later { font-size: 1.2rem; padding: 6px 10px; }
            .achievement-popup { bottom: 10px; right: 10px; padding: 10px 14px; max-width: 240px; }
            .achievement-popup h3 { font-size: 0.6rem; }
            .achievement-popup p { font-size: 0.5rem; }

            .menu-center .pixel-btn {
                min-width: 100px;
                font-size: 0.6rem;
                white-space: normal;
            }
            .menu-center .sound-btn {
                width: 45px;
                height: 45px;
                font-size: 1.2rem;
            }

            #gingerCat .cat-sprite {
                width: 120px;
                height: 75px;
            }
            #grayCat .cat-sprite {
                width: 90px;
                height: 75px;
            }

            .cat-speech {
                font-size: 0.45rem;
                max-width: 140px;
                min-width: 60px;
                padding: 5px 10px;
                white-space: normal;
            }

            #gingerCat .cat-speech {
                top: 105%;
            }
            #grayCat .cat-speech {
                bottom: 105%;
            }

            .btn-exit-game {
                font-size: 0.6rem;
                padding: 10px 16px;
            }
            .btn-time-toggle {
                font-size: 0.8rem;
                padding: 8px 14px;
            }
            .progress-counter {
                font-size: 0.6rem;
                padding: 8px 14px;
                border-width: 3px;
            }
            .btn-final { font-size: 0.6rem; padding: 12px 24px; bottom: 70px; }
        }
    </style>
</head>
<body>

<div id="app">

    <!-- ===== МЕНЮ ===== -->
    <div id="menuScreen">

        <div class="menu-top">
            <div class="cat-item" id="gingerCat">
                <div class="cat-speech" id="gingerSpeech">🧡</div>
                <div class="cat-sprite">
                    <img src="Fox.png" alt="Фокс">
                </div>
            </div>
        </div>

        <div class="menu-center">
            <div class="pixel-logo">
                ♥ Свадебный<br>квест
                <small>✦ найди все секреты ✦</small>
            </div>
            <div class="pixel-sub">нажми на котов — они заговорят</div>

            <div class="btn-group">
                <button class="pixel-btn" id="startGameBtn">▶ Начать</button>
                <button class="sound-btn" id="soundToggleBtn">🔊</button>
                <button class="pixel-btn" id="howToPlayBtn">❓ Как играть</button>
            </div>
        </div>

        <div class="menu-bottom">
            <div class="cat-item" id="grayCat">
                <div class="cat-speech" id="graySpeech">🐾</div>
                <div class="cat-sprite">
                    <img src="Tisha.png" alt="Тишка">
                </div>
            </div>
        </div>

        <!-- КНОПКИ-ЗНАЧКИ (ТОЛЬКО В МЕНЮ) -->
        <div style="position: absolute; bottom: 16px; left: 16px; z-index: 60; display: flex; gap: 10px;">
            <button class="btn-later" id="laterBtn">✉️</button>
            <button class="btn-later" id="photoBtn">📸</button>
            <button class="btn-later" id="achievementsBtn" style="display: none;">🏆</button>
        </div>

    </div>

    <!-- ===== ИГРА ===== -->
    <div id="gameScreen">
        <div class="game-scene">
            <img id="roomBg" src="room1.jpg" alt="Комната">

            <!-- ЗОНЫ -->
            <div class="pixel-zone" style="top: 48%; left: 14%; width: 25%; height: 35%;" data-title="💻 Ноутбук" data-text="💻 Так, почта... Ого, мне пришло письмо!<br><br>📩 «Дорогие наши!<br><br>Мы рады пригласить вас на самый важный день в нашей жизни — день, когда мы станем семьёй.<br><br>Мы очень хотим, чтобы этот вечер был тёплым, уютным и по-настоящему нашим — без лишнего шума и суеты.<br><br>Будем рады вас видеть!<br>Оля и Лёша»<br><br>📎 Ага, к письму приложена памятка. Надо не забыть скачать её в конце — там вся полная информация о свадьбе." data-sound="click.mp3" data-image="Letter.png"></div>

            <div class="pixel-zone" style="top: 5%; left: 87%; width: 13%; height: 48%;" data-title="🗺️ Карта на стене" data-text="🗺️ Так, посмотрим на карту...<br><br>🏛️ ЗАГС — здесь ребята скажут «да» и начнут новую главу.<br>🍽️ Ресторан — а здесь продолжим праздник: вкусно, тепло и по-домашнему.<br><br>Оба места отмечены. Стоит прийти минут за 10–15, чтобы точно не опоздать!" data-is-map="true" data-sound="map.mp3" data-image="Map.jpeg"></div>

            <div class="pixel-zone" style="top: 14%; left: 0%; width: 9%; height: 20%;" data-title="🖼️ Портрет" data-text="🖼️ Так, кто тут у нас...<br><br>О, знакомые лица! Кажется, Оля всё-таки дожала — и вот результат.<br><br>Шучу! Но если серьёзно — они счастливы, и это главное.<br>Обязательно скажу им что-то тёплое.<br><br>📸 Ребята создали папочку для фото с праздника. Надо будет не забыть скинуть туда свои кадры.<br><br>Кажется, я где-то уже видел пустую папку... Только где?" data-is-portrait="true" data-sound="foto.mp3"></div>

            <div class="pixel-zone" style="top: 80%; left: 55%; width: 9%; height: 10%;" data-title="🔑 Ключи от авто" data-text="🔑 О, ключи!<br><br>Значит, можно ехать. Хотя... а нужна ли мне машина?<br><br>От ЗАГСа до ресторана обещали трансфер. Может, оставить её и оторваться на полную?<br><br>⏰ Время отправления: [время]<br><br>Не опаздывать — а то уедут без меня!" data-sound="bipbip.mp3" data-image="Key.png"></div>

            <div class="pixel-zone" style="top: 79%; left: 70%; width: 19%; height: 15%;" data-title="📖 Ежедневник" data-text="📖 Так, надо бы всё записать в ежедневник, чтобы ничего не забыть.<br><br>📅 [Дата]<br>⏰ [Время]<br><br>👔 Дресс-код: мягкая классика. Смокинг — это красиво, но не всегда удобно.<br><br>👶 Надо бы придумать, с кем оставить детей, чтобы отдохнуть полноценно.<br><br>💐 И кстати, цветы не стоит — они ненадолго. А вот вклад в их будущее — самое то!" data-sound="list.mp3" data-image="Text.png"></div>

            <div class="pixel-zone" style="top: 64%; left: 60%; width: 10%; height: 15%;" data-title="☕ Кружка с кофе" data-text="☕ О, кофе! Ещё горяченький.<br><br>Значит, можно спокойно допить и ехать. Глоток бодрости — и на весь день заряжен(а)!<br><br>Кажется, всё продумано. Осталось только дождаться праздника!" data-sound="kofe.mp3" data-image="Mug.png"></div>

            <button class="pixel-btn btn-final" id="finalBtn">
                💌 Открыть письмо
            </button>

            <button class="btn-exit-game" id="exitToMenuBtn">↩ Меню</button>
            <button class="btn-time-toggle" id="timeToggleBtn">🌙</button>
            <div class="progress-counter" id="progressCounter">🔍 0 / 6</div>
        </div>
    </div>

</div>

<!-- ===== МОДАЛЬНОЕ ОКНО ===== -->
<div class="pixel-modal" id="pixelModal">
    <div class="pixel-modal-box">
        <h2 id="modalTitle">Заголовок</h2>
        <div id="modalContent"><p id="modalText">Текст</p></div>
        <button class="pixel-btn" id="modalCloseBtn">✨ Отлично!</button>
    </div>
</div>

<script>
    // ==========================================
    // 1. КОМНАТА (ДЕНЬ/НОЧЬ)
    // ==========================================
    const roomImages = {
        day: 'room1.jpg',
        night: 'room2.jpeg'
    };

    let currentTime = 'day';
    const roomBg = document.getElementById('roomBg');

    function setTimeOfDay(time) {
        currentTime = time;
        roomBg.src = roomImages[time];
        document.getElementById('timeToggleBtn').textContent = time === 'day' ? '🌙' : '☀️';
    }

    const hour = new Date().getHours();
    if (hour >= 21 || hour < 6) {
        setTimeOfDay('night');
    } else {
        setTimeOfDay('day');
    }

    document.getElementById('timeToggleBtn').addEventListener('click', function() {
        const newTime = currentTime === 'day' ? 'night' : 'day';
        setTimeOfDay(newTime);

        // Ачивка «Ночной сторож»
        dayNightSwitches++;
        if (dayNightSwitches >= 5) {
            unlockAchievement('night_watch');
        }

        if (soundEnabled) {
            const file = getMusicFile();
            if (music) {
                music.pause();
                music.currentTime = 0;
            }
            music = new Audio(file);
            music.loop = true;
            music.volume = 0.08;
            currentMusicFile = file;
            music.play().catch(() => {});
        }
    });

    // ==========================================
    // 2. НАВИГАЦИЯ
    // ==========================================
    const menu = document.getElementById('menuScreen');
    const game = document.getElementById('gameScreen');
    const startBtn = document.getElementById('startGameBtn');
    const exitBtn = document.getElementById('exitToMenuBtn');
    const howToPlayBtn = document.getElementById('howToPlayBtn');

    let firstGameEntry = true;

    function showGame() {
        menu.classList.add('hidden');
        game.classList.add('active');
        
        if (firstGameEntry) {
            firstGameEntry = false;
            setTimeout(() => {
                modalTitle.textContent = '💻 Дела...';
                modalContent.innerHTML = `
                    <p>Так, надо бы заняться делами...<br><br>
                    Ой, кажется, на ноутбук пришло письмо.<br>
                    Стоило бы его открыть.</p>
                `;
                modal.classList.add('show');
                modalCloseBtn.style.display = 'block';
            }, 500);
        }
    }

    function showMenu() {
        menu.classList.remove('hidden');
        game.classList.remove('active');
        resetGame();
    }

    startBtn.addEventListener('click', showGame);
    exitBtn.addEventListener('click', showMenu);

    howToPlayBtn.addEventListener('click', function() {
        modalTitle.textContent = '❓ Как играть';
        modalContent.innerHTML = `
            <p>🕵️‍♀️ Привет! Поиграем в детектива?<br><br>
            🔍 Ищи активные предметы на столе, тыкай на всё, что выглядит интересно.<br>
            Каждый предмет расскажет вам часть истории 📖.<br><br>
            🎯 Ваша цель — найти все секреты, чтобы получить приглашение на свадьбу.<br><br>
            🐱 Не игнорируйте котиков! Они тоже хотят поздороваться.<br><br>
            Удачи! Мы вас любим❤️</p>
        `;
        modal.classList.add('show');
        modalCloseBtn.style.display = 'block';
    });

    // ==========================================
    // 3. ЗВУК (МУЗЫКА ДЕНЬ/НОЧЬ)
    // ==========================================
    let soundEnabled = true;
    let music = null;
    let currentMusicFile = '';

    const musicFiles = {
        day: 'day.mp3',
        night: 'night.mp3'
    };

    function getMusicFile() {
        if (currentTime === 'night') {
            return musicFiles.night;
        } else {
            return musicFiles.day;
        }
    }

    function initMusic(forcePlay = false) {
        const file = getMusicFile();
        if (!music || currentMusicFile !== file) {
            if (music) {
                music.pause();
                music.currentTime = 0;
            }
            music = new Audio(file);
            music.loop = true;
            music.volume = 0.08;
            currentMusicFile = file;
        }
        if (forcePlay || soundEnabled) {
            music.play().catch(() => {
                console.log('Автовоспроизведение заблокировано');
            });
        }
        return music;
    }

    document.addEventListener('click', function firstClick() {
        if (soundEnabled) {
            initMusic(true);
        }
        document.removeEventListener('click', firstClick);
    });

    document.getElementById('soundToggleBtn').addEventListener('click', function() {
        soundEnabled = !soundEnabled;
        this.textContent = soundEnabled ? '🔊' : '🔇';
        if (soundEnabled) {
            if (music) {
                music.play().catch(() => {});
            } else {
                initMusic(true);
            }
        } else {
            if (music) {
                music.pause();
            }
        }
    });

    // ==========================================
    // 4. ЗВУКИ ДЛЯ ЗОН
    // ==========================================
    function playZoneSound(soundFile) {
        if (!soundEnabled) return;
        const audio = new Audio(soundFile);
        audio.volume = 0.3;
        audio.play().catch(() => {});
    }

    // ==========================================
    // 5. КОТЫ
    // ==========================================
    function playCatSound(type) {
        if (!soundEnabled) return;
        const url = type === 'purr' ? 'mur.mp3' : 'myau.mp3';
        const snd = new Audio(url);
        snd.volume = 0.3;
        snd.play().catch(() => {});
    }

    function showSpeech(el, txt) {
        el.textContent = txt;
        el.classList.add('show');
        clearTimeout(el._timeout);
        el._timeout = setTimeout(() => el.classList.remove('show'), 3000);
    }

    document.getElementById('gingerCat').addEventListener('click', function() {
        playCatSound('purr');
        showSpeech(document.getElementById('gingerSpeech'), 'Мррр… Привет! Я Фокс! 🧡');
        foxClicks++;
        checkCatsAchievement();
    });

    document.getElementById('grayCat').addEventListener('click', function() {
        playCatSound('meow');
        showSpeech(document.getElementById('graySpeech'), 'Мяу! Я Тишка! Привет! Поиграем? 🐾');
        tishaClicks++;
        checkCatsAchievement();
    });

    // ==========================================
    // 6. АЧИВКИ
    // ==========================================
    let foxClicks = 0;
    let tishaClicks = 0;
    let mugClicks = 0;
    let mapClicks = 0;
    let keyClicks = 0;
    let dayNightSwitches = 0;
    let totalZoneClicks = 0;
    let achievements = [];

    const achievementsData = {
        cats: { name: '🐱 Любитель пушистиков', desc: 'Котики уже мурчат от удовольствия!' },
        coffee: { name: '☕ Кофеман', desc: 'Заряд бодрости на день обеспечен!' },
        traveler: { name: '🗺️ Путешественник', desc: 'Изучил маршрут вдоль и поперёк!' },
        driver: { name: '🔑 Автолюбитель', desc: 'Только на газ, только вперёд!' },
        night_watch: { name: '🌙 Ночной сторож', desc: 'Свет и тьма под вашим контролем!' },
        curious: { name: '🕵️ Любопытная Варвара', desc: 'Ну а вдруг там что-то важное?' },
        super_sleuth: { name: '🔍 Сыщик-переросток', desc: 'Вы явно переработали!' },
        detective: { name: '🏆 Настоящий детектив', desc: 'Вы раскрыли это дело!' },
        cinephile: { name: '🎬 Киноман', desc: 'Досмотрели до конца!' },
        gamer: { name: '👑 Геймер года', desc: 'Все ачивки собраны! Вы легенда!' }
    };

    function unlockAchievement(key) {
        if (achievements.includes(key)) return;
        achievements.push(key);
        
        // Показываем всплывашку
        const popup = document.createElement('div');
        popup.className = 'achievement-popup';
        popup.innerHTML = `
            <h3>🏆 НОВАЯ АЧИВКА</h3>
            <p class="ach-name">${achievementsData[key].name}</p>
            <p>${achievementsData[key].desc}</p>
        `;
        document.body.appendChild(popup);

        setTimeout(() => {
            popup.classList.add('hide');
            setTimeout(() => popup.remove(), 500);
        }, 4000);

        // Показываем кнопку ачивок
        document.getElementById('achievementsBtn').style.display = 'block';

        // Проверяем «Геймер года»
        if (achievements.length === 9 && !achievements.includes('gamer')) {
            unlockAchievement('gamer');
        }
    }

    function checkCatsAchievement() {
        if (foxClicks + tishaClicks >= 10) {
            unlockAchievement('cats');
        }
    }

    // ==========================================
    // 7. ИГРОВЫЕ ЗОНЫ
    // ==========================================
    const zones = document.querySelectorAll('.pixel-zone');
    const modal = document.getElementById('pixelModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalContent = document.getElementById('modalContent');
    const modalCloseBtn = document.getElementById('modalCloseBtn');

    let foundCount = 0;
    const totalZones = zones.length;
    const progressCounter = document.getElementById('progressCounter');
    const finalBtn = document.getElementById('finalBtn');
    const foundStatus = new Array(totalZones).fill(false);

    zones.forEach((zone, index) => {
        zone.addEventListener('click', function(e) {
            e.stopPropagation();

            totalZoneClicks++;
            if (totalZoneClicks >= 20) {
                unlockAchievement('super_sleuth');
            }

            const soundFile = this.dataset.sound;
            if (soundFile) {
                playZoneSound(soundFile);
            }

            const title = this.dataset.title || 'Секрет!';
            const text = this.dataset.text || 'Ты что-то нашёл!';
            const isMap = this.dataset.isMap === 'true';
            const isPortrait = this.dataset.isPortrait === 'true';

            // Считаем клики для ачивок
            if (title.includes('Кружка')) {
                mugClicks++;
                if (mugClicks >= 3) unlockAchievement('coffee');
            }
            if (title.includes('Карта')) {
                mapClicks++;
                if (mapClicks >= 3) unlockAchievement('traveler');
            }
            if (title.includes('Ключи')) {
                keyClicks++;
                if (keyClicks >= 3) unlockAchievement('driver');
            }

            modalContent.innerHTML = '';

            const imageFile = this.dataset.image;
            if (imageFile) {
                const img = document.createElement('img');
                img.src = imageFile;
                img.alt = title;
                img.style.maxWidth = '100%';
                img.style.marginBottom = '15px';
                img.style.borderRadius = '0px';
                modalContent.appendChild(img);
            }

            if (isPortrait) {
                const img = document.createElement('img');
                img.src = 'Foto.jpeg';
                img.alt = 'Портрет';
                modalContent.appendChild(img);
            }

            const p = document.createElement('p');
            p.innerHTML = text;
            modalContent.appendChild(p);

            if (isMap) {
                const zagcBtn = document.createElement('button');
                zagcBtn.className = 'pixel-btn';
                zagcBtn.textContent = '🏛️ ЗАГС';
                zagcBtn.style.marginTop = '10px';
                zagcBtn.style.marginRight = '10px';
                zagcBtn.style.fontSize = '0.6rem';
                zagcBtn.style.padding = '8px 20px';
                zagcBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    window.open('https://yandex.ru/maps/?text=Санкт-Петербург,+Фурштатская+улица,+52', '_blank');
                });
                modalContent.appendChild(zagcBtn);

                const cafeBtn = document.createElement('button');
                cafeBtn.className = 'pixel-btn';
                cafeBtn.textContent = '🍽️ Ресторан';
                cafeBtn.style.marginTop = '10px';
                cafeBtn.style.fontSize = '0.6rem';
                cafeBtn.style.padding = '8px 20px';
                cafeBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    window.open('https://yandex.ru/maps/?text=Санкт-Петербург,+Суворовский+проспект,+25', '_blank');
                });
                modalContent.appendChild(cafeBtn);
            }

            modalTitle.textContent = title;
            modal.classList.add('show');
            modalCloseBtn.style.display = 'block';

            if (!foundStatus[index]) {
                foundStatus[index] = true;
                foundCount++;
                progressCounter.textContent = `🔍 ${foundCount} / ${totalZones}`;

                if (foundCount === totalZones) {
                    finalBtn.style.display = 'block';
                    progressCounter.classList.add('complete');
                    unlockAchievement('detective');
                }
            }
        });
    });

    // ==========================================
    // 8. ФИНАЛ + ТИТРЫ + ПАМЯТКА
    // ==========================================
    function showCredits() {
        unlockAchievement('cinephile');
        
        const creditsModal = document.createElement('div');
        creditsModal.className = 'pixel-modal show';
        creditsModal.id = 'creditsModal';
        creditsModal.innerHTML = `
            <div class="pixel-modal-box" style="max-width: 560px;">
                <h2 style="text-align:center; font-size:1.2rem;">🎬 ТИТРЫ</h2>
                <div class="credits-text">
                    ★ СВАДЕБНЫЙ КВЕСТ ★
                    Все секреты найдены! 🎉

                    ━━━━━━━━━━━━━━━━━━━━━━━━━━━

                    <span class="highlight">В ГЛАВНЫХ РОЛЯХ:</span>

                    👰🏻‍♀️ Ольга — генеральный продюссер,
                    идейный вдохновитель и сценарист

                    🤵🏻‍♂️ Алексей — со-сценарист
                    (читал вслух и одобрял)

                    ━━━━━━━━━━━━━━━━━━━━━━━━━━━

                    <span class="highlight">ЗА КУЛИСАМИ:</span>

                    🎬 Генеральный продюссер — Ольга
                    ✍️ Сценарист — Ольга (при участии Алексея,
                    который говорил: «классно, давай так»)
                    🎨 Художник — нейросети и Ольга
                    💻 Технический директор — я (с помощью ИИ)

                    ━━━━━━━━━━━━━━━━━━━━━━━━━━━

                    <span class="highlight">В ЭПИЗОДИЧЕСКИХ РОЛЯХ:</span>

                    🐱 Фокс — удалил последнюю рабочую версию
                    🐱 Тихомира — нажала на «не сохранять»
                    и помешала печатать

                    ☕ Кружка с кофе — поставщик сил
                    🗺️ Карта — вдохновитель для маршрутов
                    💻 Ноутбук — хранитель тайн и угроз

                    ━━━━━━━━━━━━━━━━━━━━━━━━━━━

                    <span class="highlight">ИСКРЕННЕ БЛАГОДАРИМ:</span>

                    Всех, кто нашёл все секреты!
                    Вы — главные герои этого вечера!

                    🫶 Будем ждать вас 15 июня!

                    ━━━━━━━━━━━━━━━━━━━━━━━━━━━
                    Спасибо за игру! 🎮
                </div>
                <button class="pixel-btn" id="closeCreditsBtn" style="font-size:0.7rem; padding:10px 28px; margin-top:15px;">✨ Закрыть титры</button>
            </div>
        `;
        document.body.appendChild(creditsModal);

        document.getElementById('closeCreditsBtn').addEventListener('click', function() {
            creditsModal.remove();
            // После закрытия титров — показываем список ачивок
            if (achievements.length > 0) {
                showAchievementsList();
            }
        });

        creditsModal.addEventListener('click', function(e) {
            if (e.target === creditsModal) {
                creditsModal.remove();
                if (achievements.length > 0) {
                    showAchievementsList();
                }
            }
        });
    }

    function showAchievementsList() {
        const modalAch = document.createElement('div');
        modalAch.className = 'pixel-modal show';
        modalAch.id = 'achievementsModal';
        
        let listHTML = '';
        for (const key in achievementsData) {
            const got = achievements.includes(key);
            if (got) {
                listHTML += `<div class="got">✅ ${achievementsData[key].name}<br>«${achievementsData[key].desc}»</div><br>`;
            } else {
                listHTML += `<div class="not-got">⬜ ${achievementsData[key].name}</div><br>`;
            }
        }

        modalAch.innerHTML = `
            <div class="pixel-modal-box" style="max-width: 520px;">
                <h2 style="text-align:center; font-size:1.1rem;">🏆 ВАШИ АЧИВКИ</h2>
                <div class="achievements-list">
                    ${listHTML}
                    <br>Собрано: ${achievements.length} / 10
                </div>
                <button class="pixel-btn" id="closeAchBtn" style="font-size:0.7rem; padding:10px 28px; margin-top:15px;">✨ Закрыть</button>
            </div>
        `;
        document.body.appendChild(modalAch);

        document.getElementById('closeAchBtn').addEventListener('click', function() {
            modalAch.remove();
        });

        modalAch.addEventListener('click', function(e) {
            if (e.target === modalAch) {
                modalAch.remove();
            }
        });
    }

    function downloadPDF() {
        alert('📄 Здесь будет скачивание PDF-файла. Положите файл pamyatka.pdf в папку с сайтом.');
    }

    finalBtn.addEventListener('click', function() {
        playZoneSound('fanfary.mp3');
        modalTitle.textContent = '🎉 Ну что, детективы, вы справились!';
        modalContent.innerHTML = `
            <p>Все секреты раскрыты, все места найдены. Теперь вы знаете о нашем празднике почти всё.<br><br>
            Подведём итоги:<br><br>
            📅 [Дата]<br>
            🏛️ [Название ЗАГСа]<br>
            🍽️ [Название ресторана]<br><br>
            Все детали — в памятке. Не забудьте её скачать, там всё подробно и удобно.<br><br>
            📩 Пожалуйста, подтвердите своё участие до [Дата], чтобы мы никого не потеряли в процессе подготовки.<br>
            И да, не забудьте про своих спутников 😉<br><br>
            Ждём вас!</p>
            <button class="pixel-btn" id="creditsBtn" style="font-size:0.6rem;padding:8px 20px;margin-top:10px;">🎬 Посмотреть титры</button>
            <button class="pixel-btn" id="finalDownloadBtn" style="font-size:0.6rem;padding:8px 20px;margin-top:10px;">📥 Скачать памятку (PDF)</button>
        `;

        document.getElementById('creditsBtn').addEventListener('click', function(e) {
            e.stopPropagation();
            showCredits();
        });

        document.getElementById('finalDownloadBtn').addEventListener('click', function(e) {
            e.stopPropagation();
            downloadPDF();
        });

        modal.classList.add('show');
        modalCloseBtn.style.display = 'block';
        this.style.display = 'none';
    });

    // ==========================================
    // 9. КНОПКА-КОНВЕРТ «✉️»
    // ==========================================
    document.getElementById('laterBtn').addEventListener('click', function(e) {
        e.stopPropagation();
        unlockAchievement('curious');
        
        modalTitle.textContent = '✉️ Письмо с пометкой «вскрыть позже»';
        modalContent.innerHTML = `
            <p style="margin-bottom:20px;">📩 Вы нашли информационное письмо с пометкой «вскрыть позже».</p>
            <p style="margin-bottom:20px;">Внутри — памятка со всеми деталями нашего праздника.</p>
            <p style="margin-bottom:20px;">Чтобы её открыть, мы приглашаем вас пройти наш небольшой квест.<br>
            Обещаем, это ненадолго и даже весело!</p>
            <p style="margin-bottom:20px;">Если вы уже прошли или очень торопитесь — нажмите «Всё равно вскрыть».</p>
            <p style="margin-bottom:20px;">❤️</p>
            <button class="pixel-btn" id="closeLaterBtn" style="font-size:0.6rem;padding:8px 20px;margin-right:10px;">🎮 Пройти квест</button>
            <button class="pixel-btn" id="downloadLaterBtn" style="font-size:0.6rem;padding:8px 20px;">✉️ Всё равно вскрыть</button>
        `;
        modal.classList.add('show');
        modalCloseBtn.style.display = 'none';

        document.getElementById('closeLaterBtn').addEventListener('click', function(e) {
            e.stopPropagation();
            modal.classList.remove('show');
            modalCloseBtn.style.display = 'block';
        });

        document.getElementById('downloadLaterBtn').addEventListener('click', function(e) {
            e.stopPropagation();
            downloadPDF();
            modal.classList.remove('show');
            modalCloseBtn.style.display = 'block';
        });
    });

    // ==========================================
    // 10. КНОПКА-ФОТО «📸»
    // ==========================================
    document.getElementById('photoBtn').addEventListener('click', function(e) {
        e.stopPropagation();
        modalTitle.textContent = '📸 О, какая-то папка...';
        modalContent.innerHTML = `
            <p style="margin-bottom:20px;">Пока пустая. Интересно, зачем она?</p>
            <p style="margin-bottom:20px;">Наверное, узнаю, когда пройду квест до конца.</p>
            <button class="pixel-btn" id="photoLinkBtn" style="font-size:0.6rem;padding:8px 20px;">📸 Перейти в папку</button>
        `;
        modal.classList.add('show');
        modalCloseBtn.style.display = 'none';

        document.getElementById('photoLinkBtn').addEventListener('click', function(e) {
            e.stopPropagation();
            alert('📸 Здесь будет ссылка на папку с фото.');
            modal.classList.remove('show');
            modalCloseBtn.style.display = 'block';
        });
    });

    // ==========================================
    // 11. КНОПКА АЧИВОК «🏆»
    // ==========================================
    document.getElementById('achievementsBtn').addEventListener('click', function(e) {
        e.stopPropagation();
        showAchievementsList();
    });

    // ==========================================
    // 12. ЗАКРЫТИЕ МОДАЛКИ
    // ==========================================
    modalCloseBtn.addEventListener('click', () => modal.classList.remove('show'));
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('show'); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') modal.classList.remove('show'); });

    // ==========================================
    // 13. СБРОС ИГРЫ
    // ==========================================
    function resetGame() {
        foundCount = 0;
        foundStatus.fill(false);
        progressCounter.textContent = `🔍 0 / ${totalZones}`;
        progressCounter.classList.remove('complete');
        finalBtn.style.display = 'none';
    }
</script>

</body>
</html>
